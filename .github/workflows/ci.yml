name: CI/CD Pipeline

on:
  push:
    branches: [ main, deploy-finadv ]
  pull_request:
    branches: [ main, deploy-finadv ]

env:
  REGISTRY: docker.io
  IMAGE_NAME_CLIENT: hassan915/financial-adviser-client
  IMAGE_NAME_SERVER: hassan915/financial-adviser-server

jobs:
  # Job 1: Test and Build Client (React App)
  client-build:
    name: Build and Test Client
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Run ESLint
      working-directory: ./client
      run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
      continue-on-error: false
      
    - name: Build client
      working-directory: ./client
      run: npm run build
      
    - name: Upload client build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/dist/
        retention-days: 1

  # Job 2: Test and Build Server (Node.js API)
  server-build:
    name: Build and Test Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
      
    - name: Check server syntax
      working-directory: ./server
      run: node --check server.js

  # Job 3: Build and Push Docker Images
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [client-build, server-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy-finadv')
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract metadata for client
      id: meta-client
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
        
    - name: Extract metadata for server
      id: meta-server
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
        
    - name: Build and push client Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        file: ./client/Dockerfile
        push: true
        tags: ${{ steps.meta-client.outputs.tags }}
        labels: ${{ steps.meta-client.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push server Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        file: ./server/Dockerfile
        push: true
        tags: ${{ steps.meta-server.outputs.tags }}
        labels: ${{ steps.meta-server.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 4: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install npm-audit
      run: npm install -g npm-audit-resolver
      
    - name: Run security audit - Client
      working-directory: ./client
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Run security audit - Server
      working-directory: ./server
      run: npm audit --audit-level moderate
      continue-on-error: true

  # Job 5: Code Quality Check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Run client linting
      working-directory: ./client
      run: npm run lint
      
    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" client/ server/ || true; then
          echo "Found TODO/FIXME comments - consider addressing them"
        fi


  # Job 6: CI Pipeline Summary
  ci-cd-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [client-build, server-build, docker-build-push, security-scan, code-quality]
    if: always()
    
    steps:
    - name: CI Pipeline Results Summary
      run: |
        echo "## 🔄 CI Pipeline Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🛠️ Build & Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Client Build**: ${{ needs.client-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Server Build**: ${{ needs.server-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Build & Push**: ${{ needs.docker-build-push.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.client-build.result }}" == "success" && "${{ needs.server-build.result }}" == "success" && "${{ needs.docker-build-push.result }}" == "success" ]]; then
          echo "✅ **CI Pipeline Success! Docker images built and pushed.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🐳 **Docker Images Available on Docker Hub:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`hassan915/financial-adviser-client:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`hassan915/financial-adviser-server:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Images are ready for manual deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Use \`docker-compose.prod.yml\` for production deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Add GitHub Secrets for environment variables" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some CI jobs failed. Please review the errors above.**" >> $GITHUB_STEP_SUMMARY
        fi
