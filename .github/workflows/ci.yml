name: CI Pipeline

on:
  push:
    branches: [ main, deploy-finadv ]
  pull_request:
    branches: [ main, deploy-finadv ]

jobs:
  # Job 1: Test and Build Client (React App)
  client-build:
    name: Build and Test Client
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Run ESLint
      working-directory: ./client
      run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
      continue-on-error: false
      
    - name: Build client
      working-directory: ./client
      run: npm run build
      
    - name: Upload client build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/dist/
        retention-days: 1

  # Job 2: Test and Build Server (Node.js API)
  server-build:
    name: Build and Test Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
      
    - name: Check server syntax
      working-directory: ./server
      run: node --check server.js

  # Job 3: Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [client-build, server-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build client Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        file: ./client/Dockerfile
        push: false
        tags: financial-adviser-client:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build server Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        file: ./server/Dockerfile
        push: false
        tags: financial-adviser-server:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 4: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install npm-audit
      run: npm install -g npm-audit-resolver
      
    - name: Run security audit - Client
      working-directory: ./client
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Run security audit - Server
      working-directory: ./server
      run: npm audit --audit-level moderate
      continue-on-error: true

  # Job 5: Code Quality Check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Run client linting
      working-directory: ./client
      run: npm run lint
      
    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" client/ server/ || true; then
          echo "Found TODO/FIXME comments - consider addressing them"
        fi

  # Job 6: Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [client-build, server-build, docker-build, security-scan, code-quality]
    if: always()
    
    steps:
    - name: CI Results Summary
      run: |
        echo "## CI Pipeline Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Client Build**: ${{ needs.client-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Server Build**: ${{ needs.server-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Build**: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.client-build.result }}" == "success" && "${{ needs.server-build.result }}" == "success" && "${{ needs.docker-build.result }}" == "success" ]]; then
          echo "✅ **All critical jobs passed! Ready for deployment.**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some jobs failed. Please review the errors above.**" >> $GITHUB_STEP_SUMMARY
        fi
