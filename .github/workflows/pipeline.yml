name: CI/CD Pipeline - Build & Deploy to Azure ☁️

# =============================================================================
# WHEN THIS PIPELINE RUNS
# =============================================================================
on:
  push:
    branches: [deploy-finadv]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# =============================================================================
# GLOBAL VARIABLES
# =============================================================================
env:
  REGISTRY: docker.io
  IMAGE_NAME_CLIENT: hassan915/financial-adviser-client
  IMAGE_NAME_SERVER: hassan915/financial-adviser-server

jobs:
  # =============================================================================
  # JOB 0: DETECT CHANGES TYPE
  # =============================================================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      pipeline-only: ${{ steps.changes.outputs.pipeline-only }}
      has-code-changes: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Check for pipeline-only changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          pipeline-only:
            - '.github/workflows/**'
            - '**.md'
            - 'docs/**'
          frontend:
            - 'client/**'
            - 'package.json'
            - 'docker-compose*.yml'
          backend:
            - 'server/**'
            - 'package.json'
            - 'docker-compose*.yml'

  # =============================================================================
  # JOB 1: BUILD & PUSH DOCKER IMAGES WITH DOCKER-COMPOSE
  # =============================================================================
  docker-build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has-code-changes == 'true'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🏗️ Build images with docker-compose
      run: |
        # Build all services using docker compose
        docker compose build
        
        # List built images for debugging
        echo "=== All Docker Images ==="
        docker images
        
        echo "=== Financial Adviser Images ==="
        docker images | grep hassan915/financial-adviser || echo "No financial-adviser images found"

    - name: 🏷️ Tag and push images
      run: |
        # Tag with branch name and push
        docker tag hassan915/financial-adviser-client:latest hassan915/financial-adviser-client:${{ github.ref_name }}
        docker tag hassan915/financial-adviser-server:latest hassan915/financial-adviser-server:${{ github.ref_name }}
        
        # Push all tags
        docker push hassan915/financial-adviser-client:latest
        docker push hassan915/financial-adviser-client:${{ github.ref_name }}
        docker push hassan915/financial-adviser-server:latest
        docker push hassan915/financial-adviser-server:${{ github.ref_name }}
        
        echo "✅ All images pushed successfully!"

  # =============================================================================
  # JOB 2: DEPLOY TO AZURE CONTAINER APPS
  # =============================================================================
  deploy-azure:
    name: ☁️ Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [docker-build-and-push]
    if: needs.docker-build-and-push.result == 'success'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: � Deploy Backend with MongoDB Sidecar
      run: |
        # Delete existing backend container if it exists to ensure clean deployment
        az containerapp delete --name financial-adviser-server --resource-group rg-financial-adviser --yes || echo "Backend container doesn't exist"
        
        # Deploy backend with MongoDB sidecar using direct command approach
        az containerapp create \
          --name financial-adviser-server \
          --resource-group rg-financial-adviser \
          --environment financial-adviser \
          --image ${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }} \
          --target-port 8000 \
          --ingress external \
          --min-replicas 1 \
          --max-replicas 2 \
          --cpu 0.5 \
          --memory 1Gi \
          --env-vars \
            MONGO_URI="mongodb://admin:${{ secrets.MONGO_ROOT_PASSWORD || 'MongoSecure123' }}@localhost:27017/financial-adviser?authSource=admin" \
            PORT="8000" \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            GEMINI_API="${{ secrets.GEMINI_API }}" \
            OPEN_ROUTER_API="${{ secrets.OPEN_ROUTER_API }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
          --revision-suffix $(date +%s)
        
        # Add MongoDB sidecar container to the existing app
        az containerapp update \
          --name financial-adviser-server \
          --resource-group rg-financial-adviser \
          --container-name mongodb-sidecar \
          --image mongo:7.0 \
          --cpu 0.5 \
          --memory 1Gi \
          --env-vars \
            MONGO_INITDB_DATABASE="financial-adviser" \
            MONGO_INITDB_ROOT_USERNAME="admin" \
            MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_ROOT_PASSWORD || 'MongoSecure123' }}"

    - name: 🌐 Get Backend URL and Update Frontend Config
      id: backend-url
      run: |
        BACKEND_URL=$(az containerapp show --name financial-adviser-server --resource-group rg-financial-adviser --query properties.configuration.ingress.fqdn --output tsv)
        echo "BACKEND_URL=https://$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "Backend URL: https://$BACKEND_URL"

    - name: 📱 Deploy Frontend Container
      run: |
        az containerapp create \
          --name financial-adviser-client \
          --resource-group rg-financial-adviser \
          --environment financial-adviser \
          --image ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }} \
          --target-port 80 \
          --ingress external \
          --min-replicas 1 \
          --max-replicas 2 \
          --cpu 0.25 \
          --memory 0.5Gi \
          --revision-suffix $(date +%s) || \
        az containerapp update \
          --name financial-adviser-client \
          --resource-group rg-financial-adviser \
          --image ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }} \
          --revision-suffix $(date +%s)

    - name: 🔄 Update Backend URLs
      run: |
        FRONTEND_URL=$(az containerapp show --name financial-adviser-client --resource-group rg-financial-adviser --query properties.configuration.ingress.fqdn --output tsv)
        BACKEND_URL=$(az containerapp show --name financial-adviser-server --resource-group rg-financial-adviser --query properties.configuration.ingress.fqdn --output tsv)
        
        # Update backend with proper callback and frontend URLs
        az containerapp update \
          --name financial-adviser-server \
          --resource-group rg-financial-adviser \
          --set-env-vars \
            CALLBACK_URL="https://$BACKEND_URL/api/user/google/callback" \
            FRONTEND_URL="https://$FRONTEND_URL"

    - name: ✅ Azure Deployment Summary
      run: |
        echo "🎉 Deployment completed successfully!"
        
        FRONTEND_URL=$(az containerapp show --name financial-adviser-client --resource-group rg-financial-adviser --query properties.configuration.ingress.fqdn --output tsv)
        BACKEND_URL=$(az containerapp show --name financial-adviser-server --resource-group rg-financial-adviser --query properties.configuration.ingress.fqdn --output tsv)
        
        echo "📱 Frontend URL: https://$FRONTEND_URL"
        echo "🔧 Backend URL: https://$BACKEND_URL"
        echo "🗃️ MongoDB: Sidecar container (mongodb-sidecar:27017)"
        
        echo "## ☁️ Azure Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 Live Application URLs" >> $GITHUB_STEP_SUMMARY
        echo "- **Frontend**: https://$FRONTEND_URL" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend API**: https://$BACKEND_URL" >> $GITHUB_STEP_SUMMARY
        echo "- **MongoDB**: Sidecar container (mongodb-sidecar:27017)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 3: PIPELINE SUMMARY
  # =============================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-and-push, deploy-azure]
    if: always()

    steps:
    - name: 📊 Show Pipeline Results
      run: |
        echo "## 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if pipeline-only changes
        if [[ "${{ needs.detect-changes.outputs.pipeline-only }}" == "true" && "${{ needs.detect-changes.outputs.has-code-changes }}" == "false" ]]; then
          echo "### ⚡ Pipeline-Only Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "Only pipeline configuration was modified. Skipped code build and deployment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        echo "### 📋 Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- **🐳 Docker Build & Push**: ${{ needs.docker-build-and-push.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **☁️ Azure Deploy**: ${{ needs.deploy-azure.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.deploy-azure.result }}" == "success" ]]; then
          echo "## ✅ Success! Application Deployed to Azure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ☁️ Live Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live on Azure Container Apps!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Application is running on Azure Container Apps!**" >> $GITHUB_STEP_SUMMARY
        elif [[ "${{ needs.deploy-azure.result }}" == "failure" ]]; then
          echo "## ❌ Azure Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the Azure deployment job logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 To Re-run Failed Jobs Only:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Find this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Re-run failed jobs' to retry only failed steps" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⏭️ No Deployment Needed" >> $GITHUB_STEP_SUMMARY
          echo "No code changes detected or builds were skipped." >> $GITHUB_STEP_SUMMARY
        fi
