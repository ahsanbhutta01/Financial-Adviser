name: CI/CD Pipeline - Build & Deploy to Local Machine 🚀

# =============================================================================
# WHEN THIS PIPELINE RUNS
# =============================================================================
on:
  push:
    branches: [deploy-finadv]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# =============================================================================
# GLOBAL VARIABLES
# =============================================================================
env:
  REGISTRY: docker.io
  IMAGE_NAME_CLIENT: hassan915/financial-adviser-client
  IMAGE_NAME_SERVER: hassan915/financial-adviser-server

jobs:
  # =============================================================================
  # JOB 0: DETECT CHANGES TYPE
  # =============================================================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      pipeline-only: ${{ steps.changes.outputs.pipeline-only }}
      has-code-changes: ${{ steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true' }}
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Check for pipeline-only changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          pipeline-only:
            - '.github/workflows/**'
            - '**.md'
            - 'docs/**'
          frontend:
            - 'client/**'
            - 'package.json'
            - 'docker-compose*.yml'
          backend:
            - 'server/**'
            - 'package.json'
            - 'docker-compose*.yml'

  # =============================================================================
  # JOB 1: BUILD AND TEST FRONTEND (React App)
  # =============================================================================
  build-frontend:
    name: 🏗️ Build & Test Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has-code-changes == 'true'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Check for frontend changes
      uses: dorny/paths-filter@v2
      id: frontend-changes
      with:
        filters: |
          frontend:
            - 'client/**'
            - 'package.json'
            - '.github/workflows/pipeline.yml'
            - 'docker-compose*.yml'

    - name: ⚙️ Setup Node.js 20
      if: steps.frontend-changes.outputs.frontend == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: 📦 Cache dependencies
      if: steps.frontend-changes.outputs.frontend == 'true'
      uses: actions/cache@v3
      with:
        path: client/node_modules
        key: ${{ runner.os }}-client-${{ hashFiles('client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-client-

    - name: 📋 Install dependencies
      if: steps.frontend-changes.outputs.frontend == 'true'
      working-directory: ./client
      run: npm ci

    - name: 🔍 Run ESLint (Code Quality Check)
      if: steps.frontend-changes.outputs.frontend == 'true'
      working-directory: ./client
      run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0

    - name: 🏗️ Build React app
      if: steps.frontend-changes.outputs.frontend == 'true'
      working-directory: ./client
      run: npm run build

    outputs:
      changed: ${{ steps.frontend-changes.outputs.frontend }}

  # =============================================================================
  # JOB 2: BUILD AND TEST BACKEND (Node.js API)
  # =============================================================================
  build-backend:
    name: 🔧 Build & Test Backend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has-code-changes == 'true'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Check for backend changes
      uses: dorny/paths-filter@v2
      id: backend-changes
      with:
        filters: |
          backend:
            - 'server/**'
            - 'package.json'
            - '.github/workflows/pipeline.yml'
            - 'docker-compose*.yml'

    - name: ⚙️ Setup Node.js 20
      if: steps.backend-changes.outputs.backend == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: 📦 Cache dependencies
      if: steps.backend-changes.outputs.backend == 'true'
      uses: actions/cache@v3
      with:
        path: server/node_modules
        key: ${{ runner.os }}-server-${{ hashFiles('server/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-server-

    - name: 📋 Install dependencies
      if: steps.backend-changes.outputs.backend == 'true'
      working-directory: ./server
      run: npm ci

    - name: ✅ Check code syntax
      if: steps.backend-changes.outputs.backend == 'true'
      working-directory: ./server
      run: node --check server.js

    outputs:
      changed: ${{ steps.backend-changes.outputs.backend }}

  # =============================================================================
  # JOB 3: BUILD & PUSH DOCKER IMAGES WITH DOCKER-COMPOSE
  # =============================================================================
  docker-build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: always() && (needs.build-frontend.outputs.changed == 'true' || needs.build-backend.outputs.changed == 'true')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🏗️ Build images with docker-compose
      run: |
        # Build all services using docker compose
        docker compose build
        
        # List built images for debugging
        echo "=== All Docker Images ==="
        docker images
        
        echo "=== Financial Adviser Images ==="
        docker images | grep -i financial || echo "No financial-adviser images found"
        
        echo "=== Images with 'client' ==="
        docker images | grep -i client || echo "No client images found"
        
        echo "=== Images with 'server' ==="
        docker images | grep -i server || echo "No server images found"

    - name: 🏷️ Tag and push frontend image
      if: needs.build-frontend.outputs.changed == 'true' && needs.build-frontend.result == 'success'
      run: |
        # Find the correct client image name
        CLIENT_IMAGE=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep -E "(client|frontend)" | grep latest | head -1)
        echo "Found client image: $CLIENT_IMAGE"
        
        if [ -z "$CLIENT_IMAGE" ]; then
          echo "❌ No client image found! Available images:"
          docker images
          exit 1
        fi
        
        # Tag the built frontend image
        docker tag $CLIENT_IMAGE ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }}
        docker tag $CLIENT_IMAGE ${{ env.IMAGE_NAME_CLIENT }}:latest
        docker push ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }}
        docker push ${{ env.IMAGE_NAME_CLIENT }}:latest

    - name: 🏷️ Tag and push backend image
      if: needs.build-backend.outputs.changed == 'true' && needs.build-backend.result == 'success'
      run: |
        # Find the correct server image name
        SERVER_IMAGE=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep -E "(server|backend)" | grep latest | head -1)
        echo "Found server image: $SERVER_IMAGE"
        
        if [ -z "$SERVER_IMAGE" ]; then
          echo "❌ No server image found! Available images:"
          docker images
          exit 1
        fi
        
        # Tag the built backend image
        docker tag $SERVER_IMAGE ${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }}
        docker tag $SERVER_IMAGE ${{ env.IMAGE_NAME_SERVER }}:latest
        docker push $SERVER_IMAGE ${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }}
        docker push $SERVER_IMAGE ${{ env.IMAGE_NAME_SERVER }}:latest

  # =============================================================================
  # JOB 4: DEPLOY TO LOCAL MACHINE WITH DOCKER-COMPOSE
  # =============================================================================
  deploy-local-machine:
    name: 🏠 Deploy to Local Machine
    runs-on: self-hosted
    needs: [build-frontend, build-backend, docker-build-and-push]
    if: always() && (needs.docker-build-and-push.result == 'success' || (needs.build-frontend.result == 'success' && needs.build-backend.result == 'success'))

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 📝 Create environment file for deployment
      run: |
        cd server
        cat > .env << EOF
        MONGO_URI=mongodb://mongodb:27017/financial_advisor
        PORT=8000
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        GEMINI_API=${{ secrets.GEMINI_API }}
        OPEN_ROUTER_API=${{ secrets.OPEN_ROUTER_API }}
        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        CALLBACK_URL=http://localhost:8000/api/user/google/callback
        FRONTEND_URL=http://localhost:5173
        SESSION_SECRET=${{ secrets.SESSION_SECRET }}
        EOF

    - name: 🛑 Stop existing containers
      run: docker compose down || true

    - name: 📥 Pull latest images
      if: needs.docker-build-and-push.result == 'success'
      run: |
        docker pull ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }} || true
        docker pull ${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }} || true

    - name: 📝 Create docker-compose override for production images
      if: needs.docker-build-and-push.result == 'success'
      run: |
        cat > docker-compose.override.yml << EOF
        services:
          client:
            image: ${{ env.IMAGE_NAME_CLIENT }}:${{ github.ref_name }}
          server:
            image: ${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }}
        EOF

    - name: 🚀 Start all services with docker-compose
      run: docker compose up -d

    - name: ⏳ Wait for services to start
      run: |
        echo "Waiting for services to start..."
        echo "Checking backend health..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/api/health >/dev/null 2>&1; then
            echo "✅ Backend is ready!"
            break
          fi
          echo "Attempt $i/30: Backend not ready yet, waiting 2 seconds..."
          sleep 2
        done
        echo "Checking frontend..."
        for i in {1..30}; do
          if curl -f http://localhost >/dev/null 2>&1; then
            echo "✅ Frontend is ready!"
            break
          fi
          echo "Attempt $i/30: Frontend not ready yet, waiting 2 seconds..."
          sleep 2
        done

    - name: ✅ Health check
      run: |
        echo "=== Container Status ==="
        docker compose ps
        echo "=== Final Health Check ==="
        curl -f http://localhost:8000/api/health || echo "❌ Backend health check failed"
        curl -f http://localhost || echo "❌ Frontend health check failed"
        echo "🎉 Application deployed successfully!"
        echo "📱 Frontend: http://localhost"
        echo "🔧 Backend: http://localhost:8000"
        echo "🗃️ MongoDB: localhost:27017"

  # =============================================================================
  # JOB 5: SECURITY SCANNING (Only when code changes)
  # =============================================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: always() && (needs.build-frontend.outputs.changed == 'true' || needs.build-backend.outputs.changed == 'true')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔍 Security scan - Frontend
      if: needs.build-frontend.outputs.changed == 'true'
      working-directory: ./client
      run: npm audit --audit-level moderate
      continue-on-error: true

    - name: 🔍 Security scan - Backend
      if: needs.build-backend.outputs.changed == 'true'
      working-directory: ./server
      run: npm audit --audit-level moderate
      continue-on-error: true

  # =============================================================================
  # JOB 6: CODE QUALITY CHECKS (Only when code changes)
  # =============================================================================
  code-quality:
    name: ✨ Code Quality Check
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: always() && (needs.build-frontend.outputs.changed == 'true' || needs.build-backend.outputs.changed == 'true')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📋 Install frontend dependencies
      if: needs.build-frontend.outputs.changed == 'true'
      working-directory: ./client
      run: npm ci

    - name: ✨ Run frontend linting
      if: needs.build-frontend.outputs.changed == 'true'
      working-directory: ./client
      run: npm run lint

    - name: 📝 Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" client/ server/ || true; then
          echo "Found TODO/FIXME comments - consider addressing them"
        fi

  # =============================================================================
  # JOB 7: PIPELINE SUMMARY
  # =============================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, build-backend, docker-build-and-push, deploy-local-machine, security-scan, code-quality]
    if: always()

    steps:
    - name: 📊 Show Pipeline Results
      run: |
        echo "## 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if pipeline-only changes
        if [[ "${{ needs.detect-changes.outputs.pipeline-only }}" == "true" && "${{ needs.detect-changes.outputs.has-code-changes }}" == "false" ]]; then
          echo "### ⚡ Pipeline-Only Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "Only pipeline configuration was modified. Skipped code build and deployment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        echo "### 📋 Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- **🏗️ Frontend Build**: ${{ needs.build-frontend.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🔧 Backend Build**: ${{ needs.build-backend.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🐳 Docker Build & Push**: ${{ needs.docker-build-and-push.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🏠 Local Deploy**: ${{ needs.deploy-local-machine.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🛡️ Security Scan**: ${{ needs.security-scan.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **✨ Code Quality**: ${{ needs.code-quality.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.deploy-local-machine.result }}" == "success" ]]; then
          echo "## ✅ Success! Application Deployed Locally" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏠 Access Your Application" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: http://localhost" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API: http://localhost:8000" >> $GITHUB_STEP_SUMMARY
          echo "- MongoDB: localhost:27017" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Application is running locally with Docker Compose!**" >> $GITHUB_STEP_SUMMARY
        elif [[ "${{ needs.deploy-local-machine.result }}" == "failure" ]]; then
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the job logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 To Re-run Failed Jobs Only:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Find this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Re-run failed jobs' to retry only failed steps" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⏭️ No Deployment Needed" >> $GITHUB_STEP_SUMMARY
          echo "No code changes detected or builds were skipped." >> $GITHUB_STEP_SUMMARY
        fi
